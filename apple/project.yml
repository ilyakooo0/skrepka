name: SkrepkaApp
packages:
  Shared:
    path: ./generated/Shared
  App:
    path: ./generated/App/Skrepka
options:
  bundleIdPrefix: lol.skrepka
  deploymentTarget:
    iOS: "17.0"
attributes:
  BuildIndependentTargetsInParallel: true

targets:
  SkrepkaApp-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SkrepkaApp
        excludes:
          - "Info-*.plist"
          - "*.entitlements"
    settings:
      base:
        # iPhone only: the app declares portrait-only, which iPadOS rejects for an iPad
        # build (it requires landscape too). Rather than pretend to support a form factor
        # the layout was never designed for, don't claim it.
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: SkrepkaApp/SkrepkaApp.entitlements
      properties:
        # Plaintext message history sits in Application Support. Default every file the
        # app creates to Complete protection, so it is unreadable while the device is
        # locked — the KV store then opts into UnlessOpen for the files it holds open.
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    info:
      path: SkrepkaApp/Info-iOS.plist
      properties:
        CFBundleDisplayName: Skrepka
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Scan a contact's QR code to add them.
        NSPhotoLibraryUsageDescription: Choose a photo for your profile.
        # Declared so App Store Connect stops asking on every upload.
        ITSAppUsesNonExemptEncryption: false
        # Relays must be reachable over TLS. The only cleartext exception is a
        # locally-run `just server`, for development.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    dependencies:
      - package: Shared
        product: SkrepkaShared
      - package: App
        product: Skrepka
    scheme:
      management:
        shared: true
