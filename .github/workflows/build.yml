name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: linux-x86_64
            knot-platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            name: linux-arm64
            knot-platform: linux-aarch64
          - runner: macos-26
            name: macos-arm64
            knot-platform: macos-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Download knot compiler
        run: |
          version=$(basename "$(curl -sI -o /dev/null -w '%{redirect_url}' \
            https://github.com/ilyakooo0/knot/releases/latest)")
          tarball="knot-${version}-${{ matrix.knot-platform }}.tar.gz"
          curl -fsSL "https://github.com/ilyakooo0/knot/releases/download/${version}/${tarball}" \
            | tar xz
          mv "knot-${version}-${{ matrix.knot-platform }}" knot-dist

      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Compile server (Linux static)
        if: runner.os == 'Linux'
        run: |
          printf '#!/bin/sh\nexec musl-gcc -static "$@"\n' > /tmp/static-cc
          chmod +x /tmp/static-cc
          CC=/tmp/static-cc \
          KNOT_RUNTIME_LIB=${{ github.workspace }}/knot-dist/libknot_runtime.a \
          ./knot-dist/knot build server.knot

      - name: Compile server (macOS)
        if: runner.os == 'macOS'
        run: ./knot-dist/knot build server.knot

      - name: Verify binary
        run: file server

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.name }}
          path: server

  release:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Generate version
        id: version
        run: echo "tag=$(git -C repo log -1 --format='%cd' --date='format:%Y.%m.%d.%H%M')" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        run: |
          for dir in server-*/; do
            name="${dir%/}"
            mv "${dir}server" "${name}.tmp"
            rm -rf "$dir"
            mv "${name}.tmp" "$name"
          done
          chmod +x server-*

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: server-*
